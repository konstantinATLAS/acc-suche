<head>

<style>
  /* Tokens aus atlas-design-library/tokens/colors.json (CI v3) */
  :root {
    --ink: #030924; --ink-soft: #193154; --paper: #FFFFFF; --paper-cool: #F6F8FB; --line: #E4E9F0;
    --blue: #0C63A6; --select: #1780C7;
    --navy: linear-gradient(35deg, #020716, #0B2E5C 60%, #134487);
    --tint-blue: #E8F1FA; --tint-green: #E5F5EC; --ink-green: #11743A;
    --neg-face: #FBEAE1; --neg-mark: #C2504A; --neg-ink: #8E3A35;
    --r: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper-cool); color: var(--ink);
    font-family: Inter, -apple-system, system-ui, sans-serif; font-size: 15px; line-height: 1.45;
    -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
  a { color: var(--blue); text-decoration: none; }

  /* Kopf */
  header { position: sticky; top: 0; z-index: 5; background: var(--navy);
    padding: calc(14px + var(--oben, 0px)) 16px 12px; box-shadow: 0 6px 24px rgba(3, 9, 36, .18); }
  /* iPhone: Safari legt oben eine unscharfe Kante über die Seite, als Home-Bildschirm-App die Statusleiste */
  @media (hover: none) and (pointer: coarse) { :root { --oben: 22px; } }
  html.app { --oben: 44px; }
  .kopfzeile { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .kopfzeile svg { height: 17px; width: auto; display: block; }
  .stand { color: rgba(255, 255, 255, .62); font-size: 12px; letter-spacing: .02em; }
  .suche { position: relative; }
  .suche input { width: 100%; height: 50px; border: 0; border-radius: var(--r); padding: 0 46px 0 46px;
    font: 500 17px Inter, sans-serif; color: var(--ink); background: var(--paper); outline: none;
    -webkit-appearance: none; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .4); }
  .suche input:focus { box-shadow: inset 0 0 0 2px var(--select); }
  .suche input::-webkit-search-cancel-button { -webkit-appearance: none; }
  .suche input::placeholder { color: #8391A7; font-weight: 400; }
  .lupe { position: absolute; left: 15px; top: 15px; width: 20px; height: 20px; color: var(--ink-soft); }
  .leeren { position: absolute; right: 6px; top: 6px; width: 38px; height: 38px; border: 0; border-radius: 10px;
    background: var(--paper-cool); color: var(--ink-soft); font-size: 20px; line-height: 38px; display: none; }
  .filter { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
  .filter::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 0; border-radius: 999px; padding: 7px 12px; font: 500 13px Inter, sans-serif;
    color: rgba(255, 255, 255, .86); background: rgba(255, 255, 255, .1);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14); }
  .chip.an { background: var(--select); color: #fff; box-shadow: none; }
  .trenner { flex: none; width: 1px; background: rgba(255, 255, 255, .18); margin: 4px 2px; }

  /* Liste */
  main { padding: 12px 16px 48px; max-width: 760px; margin: 0 auto; }
  .meta { color: var(--ink-soft); font-size: 13px; margin: 4px 2px 10px; }
  .karte { background: var(--paper); border-radius: var(--r); margin-bottom: 10px;
    box-shadow: 0 1px 0 var(--line), 0 0 0 1px var(--line); overflow: hidden; }
  .karte-kopf { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 13px 14px;
    font: inherit; color: inherit; cursor: pointer; }
  .zeile1 { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  .firma { font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
  .groesse { flex: none; font-weight: 600; font-size: 14px; color: var(--blue); white-space: nowrap; }
  .groesse.klasse { color: var(--ink-soft); font-weight: 500; }
  .zeile2 { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 7px; }
  .klein { color: var(--ink-soft); font-size: 13px; }
  .badge { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 500;
    background: var(--paper-cool); color: var(--ink-soft); box-shadow: inset 0 0 0 1px var(--line); }
  .badge.gruen { background: var(--tint-green); color: var(--ink-green); box-shadow: none; }
  .badge.blau { background: var(--tint-blue); color: var(--blue); box-shadow: none; }
  .badge.stark { background: var(--select); color: #fff; box-shadow: none; }
  .badge.peach { background: var(--neg-face); color: var(--neg-ink); box-shadow: none; }

  .abschnitt { margin: 18px 2px 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--ink-soft); }
  .abschnitt.bester { margin-top: 2px; color: var(--select); }
  .karte.top { box-shadow: 0 0 0 2px var(--select), 0 8px 24px rgba(23, 128, 199, .16); }
  .karte.top .karte-kopf { background: linear-gradient(180deg, var(--tint-blue), var(--paper) 85%); }
  .karte.top .firma { font-size: 17.5px; }
  .kpis { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 3px; font-size: 13px; color: var(--ink-soft); }
  .kpis b { font-weight: 600; color: var(--ink); }
  .grund { margin-top: 7px; font-size: 13px; color: var(--ink-soft); overflow-wrap: anywhere; }
  .grund b { font-weight: 500; color: var(--ink); }
  mark { background: #D3E6F7; color: inherit; border-radius: 3px; padding: 0 1px; }
  .detail { display: none; padding: 0 14px 14px; border-top: 1px solid var(--line); }
  .karte.offen .detail { display: block; }
  .hinweis { margin-top: 12px; background: var(--neg-face); color: var(--neg-ink); border-radius: 10px;
    padding: 9px 11px; font-size: 13.5px; font-weight: 500; }
  .zahlen { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .zahl { background: var(--paper-cool); border-radius: 10px; padding: 9px 11px; }
  .zahl b { display: block; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .zahl span { font-size: 12px; color: var(--ink-soft); }
  .block { margin-top: 14px; }
  .block h4 { margin: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-soft); }
  .person { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0;
    border-bottom: 1px solid var(--line); }
  .person:last-child { border-bottom: 0; }
  .person .wer { min-width: 0; }
  .person .wer div { overflow-wrap: anywhere; }
  .person .mail { font-size: 12.5px; color: var(--ink-soft); }
  .mini { flex: none; font-size: 12.5px; font-weight: 600; padding: 6px 10px; border-radius: 9px;
    background: var(--tint-blue); color: var(--blue); }
  .liste-kv { display: grid; grid-template-columns: 112px 1fr; gap: 4px 10px; font-size: 14px; }
  .liste-kv dt { color: var(--ink-soft); }
  .liste-kv dd { margin: 0; overflow-wrap: anywhere; }
  .knoepfe { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .knopf { display: flex; align-items: center; justify-content: center; flex: 1 1 30%; min-width: 96px; text-align: center; padding: 11px 10px; border-radius: 11px;
    font-weight: 600; font-size: 14px; background: var(--ink); color: #fff; }
  .knopf.hell { background: var(--tint-blue); color: var(--blue); }
  .fuss { margin-top: 12px; font-size: 11.5px; color: #8391A7; }

  .leer { background: var(--paper); border-radius: var(--r); padding: 16px; box-shadow: 0 0 0 1px var(--line); }
  .leer h3 { margin: 0 0 4px; font-size: 16px; }
  .leer .knoepfe .knopf { flex: 1 1 40%; font-size: 13.5px; }
  .flaeche { background: var(--paper-cool); }
  .ohne-login header { display: none; }
  .ohne-login .flaeche { background: var(--navy); }
  .ohne-login main { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .login { width: 100%; max-width: 360px; text-align: center; color: #fff; padding-bottom: 8vh; }
  .login svg { display: block; height: 30px; width: auto; margin: 0 auto 30px; }
  /* Titel immer einzeilig: darf die volle Bildschirmbreite nutzen, bleibt auf normalen iPhones bei 27px
     und wird nur auf sehr schmalen Geräten kleiner */
  .login h1 { margin: 0 0 10px calc(50% - 50vw); width: 100vw; white-space: nowrap;
    font-size: min(27px, calc(7.2vw - 1.2px)); font-weight: 600; letter-spacing: -.02em; }
  .login p { margin: 0 0 30px; color: rgba(255, 255, 255, .76); font-size: 15px; line-height: 1.5; }
  /* CTA laut atlas-design-library: Orange nur im Button, Verlauf 180deg, Pille */
  .cta { display: block; padding: 15px 22px; border-radius: 999px; font-weight: 600; font-size: 16px; color: #fff;
    background: linear-gradient(180deg, #FFB24E, #F2842A);
    box-shadow: 0 10px 28px rgba(242, 132, 42, .32), inset 0 1px 0 rgba(255, 255, 255, .35); }
  .login-fuss { margin-top: 14px; font-size: 12.5px; color: rgba(255, 255, 255, .5); }
  .alternativ { margin: 14px 0 10px; background: var(--paper); border-radius: var(--r); padding: 13px 14px;
    box-shadow: 0 0 0 1px var(--line); }
  .alternativ .alt-titel { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
  .alternativ .knoepfe { margin-top: 10px; }
  .alternativ .knopf { flex: 1 1 40%; padding: 10px 8px; font-size: 13.5px; }
  .mini.hell { background: var(--paper-cool); color: var(--ink-soft); box-shadow: inset 0 0 0 1px var(--line); }
  .live { margin-top: 18px; }
  .live h4 { margin: 0 2px 8px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    color: var(--ink-soft); }
  .live-zeile { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    background: var(--paper); border-radius: 12px; padding: 11px 12px; margin-bottom: 8px; box-shadow: 0 0 0 1px var(--line); }
  .ok { color: var(--blue); font-size: 13px; margin: 14px 2px 0; }
  .laden { text-align: center; color: var(--ink-soft); padding: 40px 0; }
  .tipp { color: var(--ink-soft); font-size: 14px; margin: 6px 2px; }
  .tipp b { color: var(--ink); font-weight: 600; }
  @media (min-width: 700px) { .zahlen { grid-template-columns: repeat(4, 1fr); } }
</style>

<script>
  // Ohne Anmeldung gar nicht erst die Suchleiste zeigen (kein Aufblitzen vor der Anmeldemaske)
  try { if (!localStorage.getItem('acc_token') && !/[#&]t=/.test(location.hash)) document.documentElement.classList.add('ohne-login'); }
  catch (e) { document.documentElement.classList.add('ohne-login'); }
</script>
<style>
  /* iOS 26 färbt den Bereich unter der Uhrzeit nach der Hintergrundfarbe der Seite.
     Deshalb ist die Seite selbst Navy, hell ist nur die Fläche hinter den Karten (.flaeche). */
  html, body { background: #020716; overscroll-behavior-y: none; }
  body { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
  .flaeche { flex: 1 0 auto; }
  header { padding-top: calc(env(safe-area-inset-top, 0px) + 24px); }
  /* Oben beginnt der Verlauf in exakt der Seitenfarbe -> kein Übergang zur Statusleiste sichtbar */
  header {
    background: linear-gradient(180deg, #020716 0, rgba(2, 7, 22, 0) calc(env(safe-area-inset-top, 0px) + 56px)),
                linear-gradient(35deg, #020716, #0B2E5C 60%, #134487); }
  /* Anmeldemaske: hell nur hinter dem Inhalt, zu allen Rändern hin Navy (kein Streifen unter der Statusleiste) */
  .ohne-login .flaeche { background: radial-gradient(130% 62% at 50% 46%, #134487 0%, #0B2E5C 42%, #020716 100%); }
  header { padding-left: calc(16px + env(safe-area-inset-left, 0px)); padding-right: calc(16px + env(safe-area-inset-right, 0px)); }
  main { padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px)); }
</style>

function enthaelt(v, t, t2) {
  var n = ' ' + norm(v) + ' ' + normKurz(v) + ' ';
  return n.indexOf(t) >= 0 || (t2 && n.indexOf(t2) >= 0);
}
function aehnelt(v, tri) {
  return norm(v).replace(/[.@]/g, ' ').split(' ').some(function (w) { return w.length >= 3 && dice(tri, trigramme(w)) >= 0.6; });
}
function gruende(r, e) {
  if (e.tel) {
    var tels = [g(r, 'Telefon (Impressum)')].concat(String(g(r, 'Suchzusatz (E-Mails, Telefon)') || '').split(' ')
      .filter(function (x) { return x.indexOf('tel:') === 0; }).map(function (x) { return x.slice(4); }));
    var t = tels.filter(function (x) { var z = ziffern(x); return z.length >= 6 && (z.indexOf(e.dq) >= 0 || e.dq.indexOf(z) >= 0); })[0];
    return t ? [{ f: 99, label: 'Telefon', wert: String(t) }] : [];
  }
  var out = [], gesehen = {};
  function merke(f, v) { var k = f + '|' + v; if (!gesehen[k]) { gesehen[k] = 1; out.push({ f: f, label: FELDER[f][0], wert: v }); } }
  e.tok.forEach(function (t, j) {
    var t2 = e.kurz[j] !== t ? e.kurz[j] : null, f, w, werte;
    for (f = 0; f < FELDER.length; f++) {
      werte = FELDER[f][1](r).filter(Boolean);
      for (w = 0; w < werte.length; w++) if (enthaelt(werte[w], t, t2)) { merke(f, werte[w]); return; }
    }
    if (t.length < 4) return;
    var tri = trigramme(t.replace(/[.@]/g, ''));
    for (f = 0; f < FELDER.length; f++) {
      werte = FELDER[f][1](r).filter(Boolean);
      for (w = 0; w < werte.length; w++) if (aehnelt(werte[w], tri)) { merke(f, werte[w]); return; }
    }
  });
  return out;
}
function markiere(text, e) {
  if (!e || !e.tok || !e.tok.length) return esc(text);
  if (e.tel) return esc(text);
  var tris = e.tok.map(function (t) { return t.length >= 4 ? trigramme(t.replace(/[.@]/g, '')) : null; });
  return String(text == null ? '' : text).split(/(\s+)/).map(function (stueck) {
    if (!stueck.trim()) return stueck;
    var n = norm(stueck), k = normKurz(stueck);
    var treffer = e.tok.some(function (t, j) {
      if (n.indexOf(t) >= 0 || k.indexOf(e.kurz[j] || t) >= 0) return true;
      return tris[j] && n.replace(/[.@]/g, ' ').split(' ').some(function (w) { return w.length >= 3 && dice(tris[j], trigramme(w)) >= 0.6; });
    });
    return treffer ? '<mark>' + esc(stueck) + '</mark>' : esc(stueck);
  }).join('');
}

// ---------------------------------------------------------------- Anzeige
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function eur(x) {
  x = Number(x); if (!x) return '';
  if (x >= 999500) return (x / 1e6).toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' Mio. €';
  if (x >= 1e3) return Math.round(x / 1e3).toLocaleString('de-DE') + ' Tsd. €';
  return Math.round(x).toLocaleString('de-DE') + ' €';
}
function pct(x) { x = Number(x); return x ? x.toLocaleString('de-DE', { maximumFractionDigits: 1 }) + ' %' : ''; }
function url(u) { u = String(u || '').trim(); if (!u) return ''; return /^https?:\/\//.test(u) ? u : 'https://' + u; }
function closeUrl(id) { return 'https://app.close.com/lead/' + id + '/'; }

function badges(r) {
  var b = [], st = String(g(r, 'Close-Status')), seg = String(g(r, 'Segment')), ei = String(g(r, 'Einladung Pre-Event'));
  if (st === 'KUNDE: AKTIV') b.push('<span class="badge gruen">Kunde aktiv</span>');
  else if (st === 'KUNDE: Churned') b.push('<span class="badge peach">Ex-Kunde</span>');
  else if (st === 'Interessiert') b.push('<span class="badge blau">Close: Interessiert</span>');
  else if (st) b.push('<span class="badge">Close: ' + esc(st) + '</span>');
  else b.push('<span class="badge">nicht in Close</span>');
  if (seg === 'Umsatzfreunde') b.push('<span class="badge blau">Umsatzfreunde</span>');
  if (/^Interessiert/.test(ei)) b.push('<span class="badge stark">Einladung: interessiert</span>');
  else if (/^Kein Interesse/.test(ei)) b.push('<span class="badge peach">Einladung: abgesagt</span>');
  else if (/^Hat geantwortet/.test(ei)) b.push('<span class="badge blau">Einladung: geantwortet</span>');
  else if (/^Angeschrieben/.test(ei)) b.push('<span class="badge">angeschrieben</span>');
  if (g(r, 'Hinweis')) b.push('<span class="badge peach">⚠ Hinweis</span>');
  return b.join('');
}

function karte(d, offen, e, top) {
  var r = d.r, h = [];
  var klasse = g(r, 'Umsatzklasse');
  var groesse = d.umsatz ? '<span class="groesse">' + eur(d.umsatz) + '</span>'
              : klasse ? '<span class="groesse klasse">Klasse ' + esc(klasse) + '</span>'
              : g(r, 'Umsatz laut Close') ? '<span class="groesse klasse">' + esc(g(r, 'Umsatz laut Close')) + '</span>' : '';
  var shop = String(g(r, 'Amazon-Shopname') || '');
  var info = [g(r, 'Land'), String(g(r, 'Produktgruppe') || '').replace(/_/g, ' ')].filter(Boolean).map(esc).join(', ') +
    (shop && norm(shop) !== norm(g(r, 'Firma')) ? ', Shop „' + esc(shop) + '“' : '');
  var kpi = [];
  if (g(r, 'Werbekosten 12 Mon. (EUR)')) kpi.push('<span><b>' + eur(g(r, 'Werbekosten 12 Mon. (EUR)')) + '</b> Werbung</span>');
  if (g(r, 'ACOS %')) kpi.push('<span><b>' + pct(g(r, 'ACOS %')) + '</b> ACOS</span>');
  if (g(r, 'TACOS %')) kpi.push('<span><b>' + pct(g(r, 'TACOS %')) + '</b> TACOS</span>');
  var grund = e && e.tokens ? gruende(r, e).filter(function (x) { return x.f > 0; }).slice(0, 2) : [];
  h.push('<div class="karte' + (offen ? ' offen' : '') + (top ? ' top' : '') + '">');
  h.push('<button class="karte-kopf"><div class="zeile1"><span class="firma">' + markiere(g(r, 'Firma') || g(r, 'Amazon-Shopname'), e) +
         '</span>' + groesse + '</div>' +
         (kpi.length ? '<div class="kpis">' + kpi.join('') + '</div>' : '') +
         '<div class="zeile2">' + badges(r) + (info ? '<span class="klein">' + info + '</span>' : '') + '</div>' +
         grund.map(function (x) {
           return '<div class="grund">Gefunden über <b>' + x.label + '</b>: ' +
                  (x.f === 99 ? '<mark>' + esc(x.wert) + '</mark>' : markiere(x.wert, e)) + '</div>';
         }).join('') + '</button>');
  h.push('<div class="detail">');
  if (g(r, 'Hinweis')) h.push('<div class="hinweis">' + esc(g(r, 'Hinweis')) + '</div>');

  var z = [];
  if (d.umsatz) z.push(['Umsatz 12 Monate', eur(d.umsatz)]);
  if (g(r, 'Werbekosten 12 Mon. (EUR)')) z.push(['Werbekosten 12 Monate', eur(g(r, 'Werbekosten 12 Mon. (EUR)'))]);
  if (g(r, 'ACOS %')) z.push(['ACOS', pct(g(r, 'ACOS %'))]);
  if (g(r, 'TACOS %')) z.push(['TACOS', pct(g(r, 'TACOS %'))]);
  if (!d.umsatz && klasse) z.push(['Amazon-Umsatzklasse', esc(klasse)]);
  if (!d.umsatz && g(r, 'Umsatz laut Close')) z.push(['Umsatz laut Close', esc(g(r, 'Umsatz laut Close'))]);
  if (z.length) {
    h.push('<div class="zahlen">' + z.map(function (x) { return '<div class="zahl"><b>' + x[1] + '</b><span>' + x[0] + '</span></div>'; }).join('') + '</div>');
    if (!d.umsatz && KLASSE_TEXT[klasse]) h.push('<div class="klein" style="margin-top:6px">Klasse ' + esc(klasse) + ': ' + KLASSE_TEXT[klasse] + '</div>');
  }

  var gf = [];
  [1, 2, 3].forEach(function (i) {
    var n = g(r, 'GF ' + i); if (!n) return;
    var li = g(r, 'GF ' + i + ' LinkedIn'), m = g(r, 'GF ' + i + ' E-Mail');
    gf.push('<div class="person"><div class="wer"><div>' + esc(n) + '</div>' + (m ? '<div class="mail">' + esc(m) + '</div>' : '') +
            '</div>' + (li ? '<a class="mini" href="' + esc(url(li)) + '" target="_blank">LinkedIn</a>'
                           : '<a class="mini hell" href="' + esc(linkedinSuche(n + ' ' + (g(r, 'Firma') || ''))) + '" target="_blank">LinkedIn suchen</a>') + '</div>');
  });
  if (gf.length) h.push('<div class="block"><h4>Geschäftsführung</h4>' + gf.join('') + '</div>');
  if (g(r, 'Weitere Personen')) h.push('<div class="block"><h4>Kontakte in Close</h4><div class="klein">' + esc(g(r, 'Weitere Personen')) + '</div></div>');

  var kv = [];
  function zeile(k, v) { if (v) kv.push('<dt>' + k + '</dt><dd>' + v + '</dd>'); }
  zeile('Amazon-Shop', esc(g(r, 'Amazon-Shopname')));
  zeile('Impressum', esc(g(r, 'Firmenname (Impressum)')));
  zeile('Close-Status', esc(g(r, 'Close-Status')));
  zeile('Segment', esc(g(r, 'Segment')));
  zeile('Betreut von', esc(g(r, 'Betreut von')));
  zeile('Produkt', esc(g(r, 'Produkt')));
  zeile('Einladung', esc(g(r, 'Einladung Pre-Event')));
  zeile('E-Mail', esc(g(r, 'E-Mail (Impressum)')));
  zeile('Telefon', g(r, 'Telefon (Impressum)') ? '<a href="tel:' + esc(String(g(r, 'Telefon (Impressum)')).replace(/[^\d+]/g, '')) + '">' + esc(g(r, 'Telefon (Impressum)')) + '</a>' : '');
  zeile('GF auch bei', esc(g(r, 'GF auch bei')));
  if (kv.length) h.push('<div class="block"><h4>Details</h4><dl class="liste-kv">' + kv.join('') + '</dl></div>');

  var k = [];
  if (g(r, 'Storefront')) k.push('<a class="knopf" href="' + esc(url(g(r, 'Storefront'))) + '" target="_blank">Storefront</a>');
  String(g(r, 'Close-Lead-IDs') || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean).forEach(function (id, i) {
    k.push('<a class="knopf hell" href="' + closeUrl(id) + '" target="_blank">' + (i ? 'Close (2. Lead)' : 'In Close') + '</a>');
  });
  if (g(r, 'Website')) k.push('<a class="knopf hell" href="' + esc(url(g(r, 'Website'))) + '" target="_blank">Website</a>');
  if (k.length) h.push('<div class="knoepfe">' + k.join('') + '</div>');
  h.push('<div class="fuss">' + [g(r, 'SID') ? 'SID ' + esc(g(r, 'SID')) : '', 'Quelle: ' + esc(g(r, 'Quelle'))].filter(Boolean).join(', ') + '</div>');
  h.push('</div></div>');
  return h.join('');
}

function linkedinSuche(q) { return 'https://www.linkedin.com/search/results/people/?keywords=' + encodeURIComponent(q); }
function nachschlagen(q, kompakt) {
  var e = encodeURIComponent(q);
  var links = [
    ['LinkedIn', linkedinSuche(q)],
    ['LinkedIn über Google', 'https://www.google.com/search?q=' + encodeURIComponent(q + ' site:linkedin.com/in')],
    ['Google', 'https://www.google.com/search?q=' + encodeURIComponent('"' + q + '"')]
  ];
  if (!kompakt) links.push(['Amazon', 'https://www.amazon.de/s?k=' + e], ['North Data', 'https://www.northdata.com/' + e]);
  return '<div class="knoepfe">' + links.map(function (l, i) {
    return '<a class="knopf' + (i ? ' hell' : '') + '" href="' + esc(l[1]) + '" target="_blank">' + l[0] + '</a>';
  }).join('') + '</div>';
}
function alternativ(q, titel, text) {
  return '<div class="alternativ"><div class="alt-titel">' + titel + '</div>' + (text ? '<div class="klein">' + text + '</div>' : '') +
         nachschlagen(q, true) + '</div>';
}

function zeichnen() {
  var q = document.getElementById('q').value;
  document.getElementById('leeren').style.display = q ? 'block' : 'none';
  var main = document.getElementById('main');
  var leer = !q.trim() && !filterGroesse && !filterStatus;
  if (leer) {
    var nSas = DATEN.filter(function (d) { return g(d.r, 'SID'); }).length;
    var nClose = DATEN.filter(function (d) { return g(d.r, 'Close-Lead-IDs'); }).length;
    main.innerHTML = '<p class="tipp">Tippe einen <b>Namen, eine Firma, Marke, Domain, E&#8209;Mail oder Telefonnummer</b>. Tippfehler sind okay.</p>' +
      '<p class="tipp">' + DATEN.length.toLocaleString('de-DE') + ' Firmen im Index: ' + nSas.toLocaleString('de-DE') +
      ' Amazon-SAS-Seller und ' + nClose.toLocaleString('de-DE') + ' mit Close-Lead.</p>' +
      '<p class="tipp">Ohne Suchbegriff zeigen die Filter oben die größten Firmen zuerst.</p>';
    return;
  }
  var e = suche(q), liste = e.liste, html = [];
  if (!liste.length) {
    html.push('<div class="leer"><h3>Nicht in unseren Daten</h3><div class="klein">Kein Treffer in der SAS-Liste und im Close-Auszug. ' +
              'Bei Personen zeigt LinkedIn meist direkt, wo sie arbeiten. Mit dem Firmennamen dann hier nochmal suchen.</div>' +
              (q.trim() ? nachschlagen(q.trim()) : '') + '</div>');
  } else {
    var zusatz = (e.aehnlich ? ', inklusive ähnlicher Schreibweisen' : '') + (liste.length > MAX ? ', die ersten ' + MAX + ' angezeigt' : '');
    var nurAehnlich = e.tokens && liste.every(function (x) { return x.f; });
    if (nurAehnlich) html.push(alternativ(q.trim(), 'Kein genauer Treffer', 'Unten stehen nur ähnliche Schreibweisen. Die Person direkt suchen:'));
    if (e.tokens) {
      html.push('<div class="abschnitt bester">' + (liste.length === 1 ? 'Treffer' : 'Bester Treffer') + '</div>');
      html.push(karte(liste[0].d, true, e, true));
      if (liste.length > 1) {
        html.push('<div class="abschnitt">' + (liste.length - 1).toLocaleString('de-DE') + ' weitere Treffer' + zusatz + '</div>');
        liste.slice(1, MAX).forEach(function (x) { html.push(karte(x.d, false, e, false)); });
      }
    } else {
      html.push('<div class="meta">' + liste.length.toLocaleString('de-DE') + ' Treffer' + zusatz + '</div>');
      liste.slice(0, MAX).forEach(function (x) { html.push(karte(x.d, false, e, false)); });
    }
  }
  if (liste.length && e.tokens && !liste.every(function (x) { return x.f; })) {
    html.push(alternativ(q.trim(), 'Nicht dabei?', 'Die Person direkt suchen:'));
  }
  html.push('<div id="live"></div>');
  main.innerHTML = html.join('');
  main.querySelectorAll('.karte-kopf').forEach(function (b) {
    b.addEventListener('click', function () { b.parentNode.classList.toggle('offen'); });
  });
  liveSuche(q, liste);
}

// ---------------------------------------------------------------- Live in Close
function liveSuche(q, liste) {
  clearTimeout(liveTimer);
  var nr = ++liveNr;
  if (q.trim().length < 3) return;
  var bekannt = {};
  liste.forEach(function (x) {
    String(g(x.d.r, 'Close-Lead-IDs') || '').split(',').forEach(function (id) { bekannt[id.trim()] = 1; });
  });
  liveTimer = setTimeout(function () {
    var box = document.getElementById('live');
    if (box) box.innerHTML = '<div class="ok">Close wird live geprüft …</div>';
    DATENQUELLE.close(q.trim(), function (res) {
      if (nr !== liveNr) return;
      var box = document.getElementById('live'); if (!box) return;
      if (!res.ok) { box.innerHTML = '<div class="ok">Live-Suche in Close nicht verfügbar: ' + esc(res.fehler) + '</div>'; return; }
      var neu = res.leads.filter(function (l) { return !bekannt[l.id]; });
      if (!neu.length) { box.innerHTML = '<div class="ok">✓ Close live geprüft, nichts Zusätzliches.</div>'; return; }
      box.innerHTML = '<div class="live"><h4>Weitere Treffer direkt aus Close</h4>' + neu.map(function (l) {
        return '<div class="live-zeile"><div><div class="firma" style="font-size:15px">' + esc(l.name) + '</div><div class="klein">' +
          esc(l.status) + (l.personen.length ? ', ' + esc(l.personen.join(', ')) : '') + '</div></div>' +
          '<a class="mini" href="' + closeUrl(l.id) + '" target="_blank">Öffnen</a></div>';
      }).join('') + '</div>';
    }, function (err) {
      if (nr !== liveNr) return;
      var box = document.getElementById('live');
      if (box) box.innerHTML = '<div class="ok">Live-Suche in Close fehlgeschlagen: ' + esc(err && err.message) + '</div>';
    });
  }, 450);
}

// ---------------------------------------------------------------- Start
document.getElementById('q').addEventListener('input', zeichnen);
document.getElementById('leeren').addEventListener('click', function () {
  var i = document.getElementById('q'); i.value = ''; i.focus(); zeichnen();
});
document.getElementById('filter').addEventListener('click', function (ev) {
  var c = ev.target.closest('.chip'); if (!c) return;
  if (c.dataset.g != null) {
    filterGroesse = Number(c.dataset.g);
    this.querySelectorAll('[data-g]').forEach(function (x) { x.classList.toggle('an', x === c); });
  } else {
    filterStatus = filterStatus === c.dataset.s ? '' : c.dataset.s;
    this.querySelectorAll('[data-s]').forEach(function (x) { x.classList.toggle('an', x.dataset.s === filterStatus); });
  }
  zeichnen();
});
DATENQUELLE.index(function (daten) {
  aufbereiten(daten);
  document.getElementById('stand').textContent = STAND ? 'Stand ' + STAND : '';
  zeichnen();
  document.getElementById('q').focus();
}, function (err) {
  var main = document.getElementById('main');
  if (err && err.anmelden) {
    document.documentElement.classList.add('ohne-login');
    var logo = document.querySelector('.kopfzeile svg');
    main.innerHTML = '<div class="login">' + (logo ? logo.outerHTML.replace(/linear-gradient/g, 'lg-login') : '') +
      '<h1>Amazon Connect Conference</h1><p>Nur für ATLAS-Konten. Einmal anmelden, danach bleibt dieses Gerät 90&nbsp;Tage angemeldet.</p>' +
      '<a class="cta" href="' + esc(DATENQUELLE.login) + '" target="_self">Mit ATLAS-Konto anmelden</a>' +
      '<div class="login-fuss">Anmeldung über Google mit @atlasoperations.de</div></div>';
    return;
  }
  main.innerHTML = '<div class="leer"><h3>Daten konnten nicht geladen werden</h3><div class="klein">' + esc(err && err.message) + '</div></div>';
});
</script>
